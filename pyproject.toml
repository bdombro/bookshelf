[project]
name = "bookshelf"
version = "0.1.0"
description = "Parametric model, cut list and instructions for four laminated pine bookshelves"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "N"]
allowed-confusables = ["×", "–"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "ocp-vscode>=4.1.0",
    "pytest>=9.1.1",
]
